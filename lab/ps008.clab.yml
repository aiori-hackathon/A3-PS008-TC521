# containerlab topology for the real 3-router FRR testbed.
#   sudo containerlab deploy -t lab/ps008.clab.yml
#   NETAGENT_DRIVER=frr python -m netagent status
#   sudo containerlab destroy -t lab/ps008.clab.yml
name: ps008

topology:
  defaults:
    kind: linux
  nodes:
    r1:
      image: quay.io/frrouting/frr:10.1.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/r1.conf:/etc/frr/frr.conf
    r2:
      image: quay.io/frrouting/frr:10.1.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/r2.conf:/etc/frr/frr.conf
    r3:
      image: quay.io/frrouting/frr:10.1.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/r3.conf:/etc/frr/frr.conf
    h1:
      image: alpine:3.20
      exec: ["ip addr add 10.0.1.10/24 dev eth1", "ip route replace default via 10.0.1.1"]
    h2:
      image: alpine:3.20
      exec: ["ip addr add 10.0.2.10/24 dev eth1", "ip route replace default via 10.0.2.1"]
    h3:
      image: alpine:3.20
      exec: ["ip addr add 10.0.3.10/24 dev eth1", "ip route replace default via 10.0.3.1"]

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]   # 10.0.12.0/30
    - endpoints: ["r1:eth2", "r3:eth1"]   # 10.0.13.0/30
    - endpoints: ["r2:eth2", "r3:eth2"]   # 10.0.23.0/30
    - endpoints: ["r1:eth3", "h1:eth1"]   # LAN1
    - endpoints: ["r2:eth3", "h2:eth1"]   # LAN2
    - endpoints: ["r3:eth3", "h3:eth1"]   # LAN3
